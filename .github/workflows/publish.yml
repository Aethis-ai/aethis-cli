name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual / chained trigger. GitHub deliberately does not fire `push: tags`
  # workflows for tags pushed by GITHUB_TOKEN (e.g. from auto-tag.yml), so we
  # expose a workflow_dispatch entry point that auto-tag.yml chains into.
  # workflow_dispatch + repository_dispatch are the only events GITHUB_TOKEN
  # is allowed to trigger.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.12.1)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0   # setuptools-scm needs full history for versioning
          fetch-tags: true # …and tags, explicitly (actions/checkout no longer fetches tags by default)

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify tag matches pyproject version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          PYPROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$PYPROJECT_VERSION" != "$VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match pyproject.toml version $PYPROJECT_VERSION"
            exit 1
          fi

      - name: Build sdist and wheel
        # Pin the build clock: with SOURCE_DATE_EPOCH set the wheel is
        # byte-identical across builds of an identical tree, so the matrix
        # jobs agree on its digest. The sdist still varies (gzip header
        # timestamp) -- see scripts/release-integrity.py.
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" uv build

      - name: Check distribution
        run: |
          uv tool install --quiet "twine>=6.0"
          uv tool run twine check dist/*

      - name: Release integrity tuple
        # Binds the exact bytes about to be published to the reviewed commit
        # they were built from. --require-clean refuses to release an artefact
        # that corresponds to no commit at all.
        run: |
          mkdir -p evidence
          uv run python scripts/release-integrity.py --require-clean --output evidence/release-integrity.json
          cat evidence/release-integrity.json >> "$GITHUB_STEP_SUMMARY"

      - name: Hermetic first-user install (built distribution)
        run: uv run python scripts/hermetic-install-check.py --source dist --output evidence/hermetic-prepublish.json

      - name: Poisoned-cache negative control
        run: uv run python scripts/hermetic-install-check.py --source dist --poison

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v7
        with:
          name: release-evidence-build
          path: evidence/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aethis-cli
    permissions:
      id-token: write  # trusted publishing via OIDC — no token needed
      contents: write  # cut a GitHub Release (gh release create) after publish

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: release-evidence-build
          path: evidence/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Verify PyPI received release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          for attempt in {1..12}; do
            PUBLISHED="$(python -c 'import json, urllib.request; print(json.load(urllib.request.urlopen("https://pypi.org/pypi/aethis-cli/json", timeout=30))["info"]["version"])')"
            if [[ "$PUBLISHED" == "$VERSION" ]]; then
              echo "PyPI has aethis-cli $VERSION"
              exit 0
            fi
            echo "PyPI reports $PUBLISHED, waiting for $VERSION (attempt $attempt/12)"
            sleep 10
          done
          exit 1

      - name: Verify the published files match the built distribution
        # Same version string is not the same artefact. Compare the sha256 the
        # registry serves against the digests recorded when these bytes were
        # built, so a substituted file cannot pass as this release.
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}" python3 - <<'PY'
          import json, os, sys, urllib.request

          version = os.environ["VERSION"]
          built = json.load(open("evidence/release-integrity.json"))["distribution"]
          with urllib.request.urlopen("https://pypi.org/pypi/aethis-cli/json", timeout=30) as fh:
              published = json.load(fh)["releases"].get(version, [])

          by_kind = {
              "wheel" if f["packagetype"] == "bdist_wheel" else "sdist": f for f in published
          }
          failures = []
          for kind, local in built.items():
              remote = by_kind.get(kind)
              if remote is None:
                  failures.append(f"{kind} missing from the registry")
              elif remote["digests"]["sha256"] != local["sha256"]:
                  failures.append(
                      f"{kind} digest mismatch: built {local['sha256']}, registry "
                      f"{remote['digests']['sha256']}"
                  )
              else:
                  print(f"{kind}: {remote['filename']} sha256={local['sha256']} matches the build")
          if failures:
              sys.exit("; ".join(failures))
          PY

      - name: Check out repo at the published tag (for CHANGELOG.md)
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Hermetic first-user install from the registry
        # The post-publish half of the first-user proof: temporary
        # HOME/XDG/cache, no credentials, empty cache, installed from the
        # registry exactly as a new developer would.
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          uv run python scripts/hermetic-install-check.py \
            --source registry --version "${RELEASE_TAG#v}" \
            --output hermetic-postpublish.json
          cat hermetic-postpublish.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: hermetic-postpublish.json

      - name: Cut GitHub Release from CHANGELOG
        # Revive the subscribe-able GitHub Releases channel: on every publish,
        # create a Release for the just-published tag with the matching
        # CHANGELOG section as its notes. Idempotent create-or-skip so a re-run
        # or workflow_dispatch never fails the publish. `--verify-tag` refuses to
        # mint a synthetic tag at HEAD — the Release only ever attaches to the
        # real published tag (epic aethis-workspace#526, sub-issue #80).
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping (idempotent)."
            exit 0
          fi
          NOTES_FILE="$(mktemp)"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "([ (]|$)" { inblock=1; next }
            inblock && /^## / { exit }
            inblock { print }
          ' CHANGELOG.md | sed '/./,$!d' > "$NOTES_FILE"  # drop leading blank line(s)
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "No CHANGELOG.md section found for version $VERSION; cannot cut a Release." >&2
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" --verify-tag
          echo "Created GitHub Release $TAG."

      - name: Trigger workspace release sync
        env:
          WORKSPACE_SYNC_TOKEN: ${{ secrets.WORKSPACE_SYNC_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${WORKSPACE_SYNC_TOKEN:-}" ]]; then
            echo "WORKSPACE_SYNC_TOKEN not configured; skipping workspace dispatch."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WORKSPACE_SYNC_TOKEN" \
            https://api.github.com/repos/Aethis-ai/aethis-workspace/dispatches \
            -d "{\"event_type\":\"release-package-published\",\"client_payload\":{\"package\":\"aethis-cli\",\"version\":\"${RELEASE_TAG#v}\",\"tag\":\"$RELEASE_TAG\"}}"

  unstick-downstream:
    # After a successful publish, find downstream PRs that declared a dependency
    # on this aethis-cli release via the marker
    #   <!-- aethis-needs: aethis-cli >= X.Y.Z -->
    # in their PR body. For each PR whose constraint is satisfied by the just-
    # published version, post a comment and flip the PR from draft to ready.
    # The marker convention is documented in
    #   aethis-workspace/.claude/rules/downstream-unstick.md
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Find and unstick dependent PRs
        env:
          # Cross-repo PR mutation needs a token with `pull-requests:write` on
          # the *target* repo, which the default GITHUB_TOKEN doesn't have.
          # Reuses the same workspace dispatch token. The consumer repos span
          # two owners, so the token must reach both; any repo it cannot read is
          # reported as a warning rather than failing the sweep.
          GH_TOKEN: ${{ secrets.WORKSPACE_SYNC_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "WORKSPACE_SYNC_TOKEN not configured; skipping unstick."
            exit 0
          fi
          VERSION="${RELEASE_TAG#v}"
          python3 - "$VERSION" <<'PY'
          import json, os, re, subprocess, sys

          version = sys.argv[1]
          marker = re.compile(
              r"<!--\s*aethis-needs:\s*aethis-cli\s*(>=|==)\s*(\d+\.\d+\.\d+)\s*-->",
              re.IGNORECASE,
          )

          # Repos that may carry an `aethis-needs: aethis-cli` marker. They span
          # two owners, so an owner-scoped query cannot see all of them; each is
          # queried individually with `gh pr list --repo`, which is genuinely
          # repo-scoped (unlike `gh search --repo`, whose filter is a query
          # qualifier against the global search index). The canonical
          # enumeration lives in the aethis-workspace registry
          # (`scripts/workspace-repos`), which this repo cannot read, so the
          # list is declared here; keep the two in step when a consumer is
          # added.
          REPOS = [
              "Aethis-ai/aethis-workspace",
              "Aethis-ai/form-an",
              "Aethis-ai/aethis-examples",
              "Aethis-ai/aethis-examples-internal",
              "Aethis-ai/aethis-mcp",
              "Aethis-ai/aethis-sdk-python",
              "Aethis-ai/tda-server",
              "Aethis-ai/docs",
              "Paul-Simpson/ok_swift",
              "Paul-Simpson/aethis.ai",
              "Paul-Simpson/aethis.law",
          ]

          def vtuple(v): return tuple(int(p) for p in v.split("."))

          def gh(*args):
              out = subprocess.check_output(["gh"] + list(args))
              return out.decode()

          prs = []
          unreachable = []
          for repo in REPOS:
              try:
                  out = gh(
                      "pr", "list",
                      "--repo", repo,
                      "--state", "open",
                      "--search", "aethis-needs",
                      "--json", "number,title,isDraft,url,body",
                      "--limit", "100",
                  )
              except subprocess.CalledProcessError as exc:
                  # Never fail the whole sweep on one unreachable repo, but say
                  # so loudly — a silent skip is how a consumer stops being
                  # unstuck without anyone noticing.
                  print(f"::warning::{repo}: could not be queried (rc={exc.returncode}); skipped")
                  unreachable.append(repo)
                  continue
              for pr in json.loads(out):
                  prs.append({**pr, "repo": repo})

          if not prs:
              print("No open PRs reference aethis-needs: aethis-cli — nothing to unstick.")
              if unreachable:
                  print(f"NOTE: {len(unreachable)} repo(s) were unreachable: {', '.join(unreachable)}")
              sys.exit(0)

          published = vtuple(version)
          for pr in prs:
              repo = pr["repo"]
              num = pr["number"]
              # The search term is a loose pre-filter; the marker regex over the
              # body (fetched in the same call) is the real test.
              body = pr.get("body") or ""
              m = marker.search(body)
              if not m:
                  continue
              op, required = m.group(1), m.group(2)
              required_t = vtuple(required)
              satisfied = (op == "==" and published == required_t) or (op == ">=" and published >= required_t)
              if not satisfied:
                  print(f"{repo}#{num}: needs aethis-cli {op} {required}, published {version}; not satisfied")
                  continue
              print(f"{repo}#{num}: marker satisfied (needs {op} {required}, got {version}) — unsticking")
              comment = (
                  f":unlock: aethis-cli **v{version}** is live on PyPI — "
                  f"this PR's `aethis-needs: aethis-cli {op} {required}` constraint is satisfied. "
                  f"Auto-readying for review."
              )
              subprocess.check_call(["gh", "pr", "comment", str(num), "-R", repo, "--body", comment])
              if pr.get("isDraft"):
                  subprocess.check_call(["gh", "pr", "ready", str(num), "-R", repo])
          PY
